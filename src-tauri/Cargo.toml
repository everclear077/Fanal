[package]
name = "fanal"
version = "0.1.0"
description = "A status lamp for the coding agents running on this machine."
authors = ["everclear077"]
license = "MIT"
repository = "https://github.com/everclear077/Fanal"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "fanal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
fanal-core = { path = "../fanal-core" }
sysinfo = "0.37"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }
