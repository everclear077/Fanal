<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fanal</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="panel" data-view="idle" data-page="agents" data-theme="dark">
    <div id="lip"></div>
    <div id="sheet">
    <div id="body">
      <div id="agents">
        <div id="list"></div>
        <div id="rule"></div>
        <div id="quiet"></div>
        <div id="foot">
          <button id="gear" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 3.2 13.6 5.4 16.3 5.1 17.2 7.6 19.5 9.1 18.7 11.6 19.5 14.1 17.2 15.6 16.3 18.1 13.6 17.8 12 20 10.4 17.8 7.7 18.1 6.8 15.6 4.5 14.1 5.3 11.6 4.5 9.1 6.8 7.6 7.7 5.1 10.4 5.4Z" />
            </svg>
          </button>
        </div>
      </div>
      <form id="settings">
        <h1 data-i18n="settings"></h1>
        <h2 data-i18n="language"></h2>
        <div id="language" class="seg"></div>
        <h2 data-i18n="appearance"></h2>
        <div id="theme" class="seg"></div>
        <h2 data-i18n="notch"></h2>
        <label class="check"><input type="checkbox" id="alert" /><span data-i18n="alert"></span></label>
        <h2 data-i18n="connected"></h2>
        <div id="grid"></div>
        <div class="done"><button type="submit" data-i18n="done"></button></div>
      </form>
    </div>
    </div>
  </div>
  <script src="marks.js"></script>
  <script src="app.js"></script>
</body>
</html>
